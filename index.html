<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>ImpeccableTech | Build, Automate, Innovate</title>

    <meta
      name="description"
      content="ImpeccableTech builds intelligent AI and automation systems, modern websites, digital experiences, and creative solutions through technology, design, and clear thinking."

    <meta name="author" content="ImpeccableTech" />

    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook / LinkedIn -->

    <meta
      property="og:title"
      content="ImpeccableTech | BUILD • AUTOMATE • INNOVATE"
    />

    <meta
      property="og:description"
      content="AI, automation, software, web development, design, and technical writing — turning complex ideas into practical digital solutions."
    />

    <meta property="og:image" content="%BASE_URL%og-image.png" />

    <meta
      property="og:image:alt"
      content="ImpeccableTech — AI, Automation, Development & Design"
    />

    <meta property="og:image:width" content="1200" />

    <meta property="og:image:height" content="630" />

    <meta property="og:site_name" content="ImpeccableTech" />

    <!-- X / Twitter -->

    <meta
      name="twitter:title"
      content="ImpeccableTech | AI, Automation, Development & Design"
    />

    <meta
      name="twitter:description"
      content="Building intelligent systems, software, digital experiences, and creative solutions."
    />

    <!-- Favicon -->
